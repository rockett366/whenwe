<div class="login-container">
  <h2>Login</h2>

  <mat-form-field appearance="fill">
    <mat-label>Email</mat-label>
    <input matInput placeholder="Enter your email" [(ngModel)]="email" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput type="password" placeholder="Enter your password" [(ngModel)]="password" />
  </mat-form-field>

  <button mat-flat-button color="primary" class="login-button" (click)="login()">Login</button>
  <div id="google-signin-button"></div>
  <p>Don’t have an account? <a routerLink="/signup">Sign up</a></p>
</div>
